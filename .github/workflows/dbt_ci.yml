

name: dbt CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  dbt-ci:
    name: Validate dbt changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
      CI_SCHEMA: WYE_TCPH_CI_PR_${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.7 dbt-snowflake==1.12.5

      - name: Create profiles directory
        run: mkdir -p "$DBT_PROFILES_DIR"

      - name: Generate temporary profiles.yml
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          python - <<'PY'
          import json
          import os

          profile = {
              "tcph_sf1": {
                  "target": "ci",
                  "outputs": {
                      "ci": {
                          "type": "snowflake",
                          "account": os.environ["SNOWFLAKE_ACCOUNT"],
                          "user": os.environ["SNOWFLAKE_USER"],
                          "password": os.environ["SNOWFLAKE_PASSWORD"],
                          "warehouse": os.environ["SNOWFLAKE_WAREHOUSE"],
                          "database": os.environ["SNOWFLAKE_DATABASE"],
                          "schema": os.environ["CI_SCHEMA"],
                          "threads": 4
                      }
                  }
              }
          }

          path = os.path.join(
              os.environ["DBT_PROFILES_DIR"],
              "profiles.yml"
          )

          with open(path, "w") as file:
              json.dump(profile, file, indent=2)
          PY

      - name: Install dbt dependencies
        run: |
          dbt deps --project-dir . --profiles-dir "$DBT_PROFILES_DIR"

      - name: Check Snowflake connection
        run: |
          dbt debug --project-dir . --profiles-dir "$DBT_PROFILES_DIR"

      - name: Build and test models
        run: |
          dbt build --project-dir . --profiles-dir "$DBT_PROFILES_DIR" --target ci

  cleanup-ci:
    name: Remove temporary CI schemas
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    env:
      CI_SCHEMA: WYE_TCPH_CI_PR_${{ github.event.pull_request.number }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Snowflake connector
        run: pip install snowflake-connector-python

      - name: Drop temporary schemas
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          python - <<'PY'
          import os
          import re
          import snowflake.connector

          database = os.environ["SNOWFLAKE_DATABASE"]
          schema = os.environ["CI_SCHEMA"]

          if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_$]*", database):
              raise ValueError("Invalid database name")

          if not re.fullmatch(r"WYE_TCPH_CI_PR_[0-9]+", schema):
              raise ValueError("Invalid CI schema name")

          conn = snowflake.connector.connect(
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              user=os.environ["SNOWFLAKE_USER"],
              password=os.environ["SNOWFLAKE_PASSWORD"],
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"]
          )

          try:
              cursor = conn.cursor()

              schemas = [
                  schema,
                  schema + "_DBT_TEST__AUDIT",
                  schema + "_ELEMENTARY"
              ]

              for name in schemas:
                  cursor.execute(
                      f'DROP SCHEMA IF EXISTS "{database}"."{name}" CASCADE'
                  )
                  print(f"Cleanup completed: {name}")

              cursor.close()
          finally:
              conn.close()
          PY
