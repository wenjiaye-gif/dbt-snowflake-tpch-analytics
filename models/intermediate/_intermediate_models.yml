version: 2

models:
  - name: int_tpch_sf1__geography
    description: Contains information about the nation and the region it belongs to.
    columns:
      - name: nation_name
        data_tests:
          - not_null
          - unique
          
  - name: int_tpch_sf1__orders_lineitem
    description: Contains information about the orders and the orders items details.
    columns:
      - name: o_orderkey
        data_tests:
          - not_null
      - name: l_linenumber
        data_tests:
          - not_null
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
            - o_orderkey
            - l_linenumber

  - name: int_tpch_sf1__order_cost
    description: Contain all details of the orders including its items and and prices.
    columns:
    - name: o_orderkey
      data_tests:
        - not_null
    - name: l_linenumber
      data_tests:
        - not_null
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
            - o_orderkey
            - l_linenumber
  - name: int_tpch_sf1__negative_account_balance
    description: Contain all customers with a negative account balance.
    columns:
    - name: c_custkey
      data_tests:
        - unique
        - not_null