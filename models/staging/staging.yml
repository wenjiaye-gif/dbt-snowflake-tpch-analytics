version: 2

models:
  - name: stg_tpch_sf1__LINEITEM
    description: cointain all orders items details.
    columns:
      - name: L_ORDERKEY
        data_tests:
          - not_null
      - name: L_LINENUMBER
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - L_ORDERKEY
              - L_LINENUMBER

  - name: stg_tpch_sf1__ORDERS
    description: contain all orders general details.
    columns:
      - name: O_ORDERKEY
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf1__REGION
    description: contain the region information.
    columns:
      - name: R_REGIONKEY
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf1__CUSTOMER
    description: Staging model that contain customer information.
    columns:
      - name: C_CUSTKEY
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf1__PART
    description: contain all piece information.
    columns:
      - name: P_PARTKEY
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf1__SUPPLIER
    description: contain all supplier infrmation.
    columns:
      - name: S_SUPPKEY
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf1__PARTSUPP
    description: contain the price of piece per supplier.
    columns:
      - name: PS_PARTKEY
        data_tests:
          - not_null
      - name: PS_SUPPKEY
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - PS_PARTKEY
              - PS_SUPPKEY

  - name: stg_tpch_sf1__NATION
    description: contain all natiaon details.
    columns:
      - name: N_NATIONKEY
        data_tests:
          - unique
          - not_null