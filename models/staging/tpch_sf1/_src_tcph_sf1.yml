version: 2

sources:
  - name: tpch_sf1
    description: '{{ doc("source_description") }}'
    database: TCPH
    schema: TCPH_SF1_DATA

    tables:
      - name: CUSTOMER
        description: Contains all customer information.

      - name: LINEITEM
        description: Order details.
        config:
          loaded_at_field: UPDATE_AT
          freshness:
            warn_after:
              count: 1
              period: day
            error_after:
              count: 7
              period: day

      - name: NATION
        description: Nation information.

      - name: ORDERS
        description: Orders information.

      - name: PART
        description: Piece information.

      - name: PARTSUPP
        description: Price of piece per supplier.

      - name: REGION
        description: Region information.

      - name: SUPPLIER
        description: Supplier information.