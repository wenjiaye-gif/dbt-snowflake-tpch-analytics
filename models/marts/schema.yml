
version: 2

models:
  - name: dim_date
    description: "Dimensión temporal para analizar las ventas por fecha, mes y año."
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

      - name: order_date
        data_tests:
          - unique
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

  - name: dim_product
    description: "Dimensión de productos del catálogo."
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

  - name: dim_geography
    description: "Dimensión geográfica con una fila por nación."
    columns:
      - name: geography_key
        data_tests:
          - unique
          - not_null

      - name: nation_name
        data_tests:
          - not_null

      - name: region_name
        data_tests:
          - not_null

  - name: fact_sales
    description: "Hechos de ventas con granularidad de línea de pedido."
    columns:
      - name: order_key
        data_tests:
          - not_null

      - name: line_number
        data_tests:
          - not_null

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: quantity_sold
        data_tests:
          - not_null

      - name: gross_sales_amount
        data_tests:
          - not_null

      - name: product_cost
        data_tests:
          - not_null

      - name: estimated_profit
        data_tests:
          - not_null
