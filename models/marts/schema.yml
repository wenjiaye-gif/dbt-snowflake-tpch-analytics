
version: 2

models:
  - name: dim_date
    description: "Dimensión temporal para analizar las ventas por fecha, mes y año."
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

      - name: full_date
        data_tests:
          - unique
          - not_null

      - name: year_number
        data_tests:
          - not_null

      - name: month_number
        data_tests:
          - not_null

  - name: dim_customer
    description: "Dimensión de clientes enriquecida con información geográfica."
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: "Dimensión de productos del catálogo."
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

  - name: dim_supplier
    description: "Dimensión de proveedores enriquecida con información geográfica."
    columns:
      - name: supplier_key
        data_tests:
          - unique
          - not_null

  - name: fact_sales
    description: "Tabla de hechos de ventas con granularidad de línea de pedido."
    columns:
      - name: order_key
        data_tests:
          - not_null

      - name: line_number
        data_tests:
          - not_null

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity_sold
        data_tests:
          - not_null

      - name: gross_sales_amount
        data_tests:
          - not_null
