version: 2

models:
  - name: dim_date
    description: "Dimensión temporal para analizar las ventas por fecha, mes y año."
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: dim_customer
    description: "Dimensión de clientes enriquecida con información geográfica."
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null:
              config:
                severity: warn
                error_if: ">=100"
                #where: "put some condition"
                # limit: number -for only show this number of failure
                # store_failures: true
          
  - name: dim_product
    description: "Dimensión de productos del catálogo."
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

  - name: dim_supplier
    description: "Dimensión de proveedores enriquecida con información geográfica."
    columns:
      - name: supplier_key
        data_tests:
          - unique
          - not_null
   # ==========================================
  # FACT: SALES
  # ==========================================
  - name: fct_sales
    description: "Tabla de hechos de ventas con granularidad de línea de pedido."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_key
              - line_number
      - dbt_utils.expression_is_true: 
          arguments:
            expression: "quantity_sold >= 0"
            config:
              severity: warn

    columns:
      - name: order_key
        data_tests:
          - not_null

      - name: line_number
        data_tests:
          - not_null

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity_sold
        data_tests:
          - not_null
          - quantity_non_negative
          
      - name: gross_sales_amount
        data_tests:
          - not_null

  # ==========================================
  # FACT: INVENTORY
  # ==========================================
  - name: fct_inventory
    description: "Tabla de hechos de inventario con granularidad de producto y proveedor."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_key
              - supplier_key

    columns:
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key

      - name: available_quantity
        data_tests:
          - not_null

      - name: unit_cost
        data_tests:
          - not_null

      - name: inventory_value
        data_tests:
          - not_null